# Human decisions for the singular-bursting-bubbles talk (see docs/SPEC.md §1.2).
# Slide content comes from the Keynote HTML export, which is not committed.

slug: singular-bursting-bubbles
title: Bursting bubbles
subtitle: Singular Worthington jets and the drops they make
speaker: Vatsal Sanjay
venue_note: First given at the University of Illinois Urbana-Champaign, October 2026.
updated: "2026-10-12"
media_base: https://media.comphy-lab.org/talks/singular-bursting-bubbles/

video:
  loop: true            # every video loops (decided 2026-10-09)
  spans: auto           # same source at the same rect on consecutive states/slides = one placement
  max_scale: 2.0        # encode at most 2x the largest on-slide box

# Movies replaced by a YouTube embed. YouTube's terms forbid overlays on the
# player, so the slide image is rebuilt without the movie and the embed sits
# clear of the title and attribution.
youtube:
  - slide: B47A6023-3D84-4F1B-9E00-F5153B91555B   # slide 6, non-Newtonian medium
    movie: Mudpots
    id: a9hUsVq9q7U
    start: 7.191
    end: 63.397
    title: Mud pots, Yellowstone National Park
    credit: "Yellowstone National Park: video from https://www.youtube.com/watch?v=a9hUsVq9q7U"
    rect: [224, 185, 1472, 828]   # largest 16:9 box clear of the title and attribution (computed by the build)
    before_start: poster          # first click state shows the poster, as in Keynote; the video starts on the next click

# Downloadable copies offered on the talk page (docs/SPEC.md section 2.1).
downloads: [pdf, pptx, key]

