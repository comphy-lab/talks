slug: singular-bursting-bubbles
title: Bursting bubbles
subtitle: Singular Worthington jets and the drops they make
speaker: Vatsal Sanjay
venue_note: First given at the University of Illinois Urbana-Champaign, October 2026.
updated: "2026-10-10"
media_base: https://media.comphy-lab.org/talks/singular-bursting-bubbles/

video:
  loop: true            # every video loops (decided 2026-10-09)
  spans: auto           # same source at the same rect on consecutive states/slides = one placement
  max_scale: 2.0        # encode at most 2x the largest on-slide box

# Movies replaced by a YouTube embed. YouTube's terms forbid overlays on the
# player, so the slide image is rebuilt without the movie and the embed sits
# clear of the title and attribution.
