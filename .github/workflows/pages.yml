name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.21" "numpy>=1.26" "pillow>=10.3" "pyyaml>=6.0" "pypdf>=5.0" "python-pptx>=1.0" "pytest>=8.0"

      - name: Validate manifests
        working-directory: tools
        run: |
          shopt -s nullglob
          manifests=(../site/*/manifest.json)
          if [ ${#manifests[@]} -eq 0 ]; then echo "no manifests"; exit 1; fi
          for m in "${manifests[@]}"; do python -m talks_build validate "$m"; done

      - name: Unit tests (no media tools, no export)
        working-directory: tools
        run: python -m pytest -q -m "not slow and not export"

      - name: Check runtime asset fingerprints
        working-directory: tools
        run: python -m talks_build refresh-assets --check

      - name: Check shared site shell against main
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m talks_build.shell_drift

      - name: Site hygiene
        run: |
          # Media lives on R2; the deployed tree must not carry it.
          if find site -type f \( -name '*.mp4' -o -name '*.mov' -o -name '*.m4v' -o -name '*.webm' \) | grep -q .; then
            echo "video files found under site/"; exit 1
          fi
          if grep -rIl --include='*.js' --include='*.html' -E 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|new Function|eval\(' site/player site/index.html site/index.js; then
            echo "forbidden DOM/eval API in player"; exit 1
          fi

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
