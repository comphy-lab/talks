[project]
name = "talks-build"
version = "1.0.0"
description = "Build pipeline for CoMPhy Lab web talks: Keynote HTML export to content-addressed media and a player manifest."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "numpy>=1.26",
    "pillow>=10.3",
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
talks-build = "talks_build.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talks_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: encodes video or renders PDF pages (needs ffmpeg, poppler, cwebp)",
    "export: needs the real Keynote export (set TALKS_EXPORT)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
